name: CI

on:
  push:
    branches: [main, cursor/**]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check dist exists
        run: test -d dist && test -f dist/index.js

  dry-run:
    name: Dry Run Test
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, build]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start in dry-run without tokens
        env:
          DRY_RUN: 'true'
          DRY_RUN_EXIT_AFTER_MS: '4000'
          LOG_LEVEL: info
          HEALTH_PORT: '3010'
        run: |
          set -euo pipefail
          node dist/index.js > /tmp/dry-run.log 2>&1 &
          pid=$!
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:3010/health; then
              break
            fi
            sleep 0.2
          done
          curl -sf http://127.0.0.1:3010/health | tee /tmp/health.json
          grep -q '"dryRun":true' /tmp/health.json
          wait "$pid"
          grep -q '\[DRY RUN\]' /tmp/dry-run.log
          grep -q 'confidential' /tmp/dry-run.log

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t coint-ticket-bot:test .

      - name: Run image in dry-run without tokens
        run: |
          docker run --rm \
            -e DRY_RUN=true \
            -e DRY_RUN_EXIT_AFTER_MS=3000 \
            -e LOG_LEVEL=info \
            coint-ticket-bot:test
