version: '3.8'

services:
  coint-ticket-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coint-ticket-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HEALTH_PORT:-3000}:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', (r) => { if (r.statusCode !== 200) throw new Error(String(r.statusCode)) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

